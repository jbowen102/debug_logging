[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "debug_logging"
version = "0.0.0"
description = "Debug and logging tools"
requires-python = ">=3.10"

[tool.setuptools]
packages = ["debug_logging"]

[tool.setuptools.package-dir]
debug_logging = "."
